spring:
  application:
    name: spring-lab
  # Lab 10: the springlab database. Real credentials come from the environment (DB_URL, DB_USERNAME,
  # DB_PASSWORD) or from ./config/application.yml, which is git-ignored; the defaults are for a local
  # teaching database only.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springlab}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that the entities match it
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

app:
  owner: Bekzhigit Asylzhan
  group: IT1-2411 IS
  date-pattern: yyyy-MM-dd HH:mm:ss
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  locale:
    default-locale: en
    supported: [en, ru, kk]

logging:
  level:
    web: INFO
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
