<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h1 th:text="${title}">Catalogue</h1>
<p th:if="${author}">Filter by author: <b th:text="${author}">author</b></p>
<p th:if="${message}" class="flash" th:text="${message}">message</p>
<table>
    <thead>
    <tr><th>ID</th><th>Title</th><th>Author</th><th>Year</th></tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2024</td>
    </tr>
    </tbody>
</table>
<h2>Add a book</h2>
<form method="post" th:action="@{/books}">
    <input name="title" placeholder="Title" required>
    <input name="author" placeholder="Author" required>
    <input name="year" type="number" placeholder="Year" required>
    <button type="submit">Add</button>
</form>
<p><a href="/">Start page</a></p>
</body>
</html>
