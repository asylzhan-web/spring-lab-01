<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Spring Lab</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<h1>Spring Lab — Bekzhigit Asylzhan, IT1-2411 IS</h1>
<p th:if="${param.logout != null}" class="flash">You have been logged out.</p>
<ul>
    <li><a th:href="@{/books}">Book catalogue</a> — users and administrators</li>
    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}">Administration</a> — administrators only</li>
    <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Log in</a></li>
</ul>
</body>
</html>
