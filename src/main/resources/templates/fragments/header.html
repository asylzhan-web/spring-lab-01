<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- The view knows who is looking at it. Hiding a link is a courtesy, not a control:
     the server-side rules in SecurityConfiguration are what actually protect the endpoints. -->
<header th:fragment="header" class="topbar">
    <nav>
        <a th:href="@{/}">Start page</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/books}">Catalogue</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administration</a>
    </nav>
    <div class="who" sec:authorize="isAuthenticated()">
        Logged in as <b sec:authentication="name">anonymous</b>
        <span class="roles" sec:authentication="principal.authorities">[ROLE_USER]</span>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit">Log out</button>
        </form>
    </div>
    <div class="who" sec:authorize="isAnonymous()">
        Not logged in · <a th:href="@{/login}">Log in</a>
    </div>
</header>
</body>
</html>
